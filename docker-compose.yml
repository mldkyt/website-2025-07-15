services:
  postgres:
    image: postgres:latest
    ports:
      - "127.0.0.1:5000:5432"
    environment:
      POSTGRES_USER: mldchan
      POSTGRES_PASSWORD: mldchan
      POSTGRES_DB: website
    volumes:
      - postgres:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:alpine
    ports:
      - "127.0.0.1:5001:6379"

volumes:
  postgres:
